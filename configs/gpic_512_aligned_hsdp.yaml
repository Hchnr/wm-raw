# wm-raw: GPIC 512px HSDP training — 2 nodes × 8 GPUs
# Based on gpic_512_aligned.yaml, with HSDP enabled for multi-node.
#
# HSDP: shard parameters within each node (8 GPUs), replicate across nodes (2 nodes).
# This reduces inter-node communication vs pure FSDP over 16 GPUs.
#
# Usage: see scripts/run_hsdp_2x8.sh

model:
  vlm_path: /share/project/eai_pwm/models/Qwen3-VL-4B-Instruct
  diffusion_path: /share/project/eai_pwm/models/Qwen3-VL-2B-Instruct
  torch_dtype: bfloat16
  communication_policy: cross_kv_concat
  layer_mapping_policy: middle_n
  hidden_state_layer_offset: 1
  cross_attention_gate_init: 0.01
  latent:
    objective: flow_matching
    prediction_type: flow
    timestep_shift: 1.0
    timestep_sampling:
      type: logit_normal
      mean: 0.0
      std: 1.0
    timestep_frequency_dim: 256
    timestep_conditioning: adaln_zero
    tokenization: patchified
    patch_size: 2
    position_embedding: bagel_2d_sincos
    max_position_size: 64

vae:
  model_path: /share/project/eai_pwm/models/BAGEL-7B-MoT/ae.safetensors
  frozen: true
  image_size: 512

data:
  dataset_type: wm_sequence_prepared
  prepared_root: /share/project/eai_pwm/prepared_datasets/gpic_train_v1_94_incremental
  image_size: 512
  batch_size: 8
  num_workers: 8
  seed: 42
  shuffle: true
  condition_prefix: "Caption: "
  condition_suffix: " <|wm_predict_image|>"
  text_condition_dropout_prob: 0.1
  cfg_dropout_mode: sentinel_only
  center_crop: false
  resolution_buckets:
    enabled: true
    stride: 16
    sizes:
      - [512, 512]
      - [448, 608]
      - [608, 448]
      - [416, 640]
      - [640, 416]
      - [384, 704]
      - [704, 384]
    max_aspect_ratio_error: 0.08
    max_upscale_ratio: 1.5

multitask:
  vlm_microbatches_per_step: 0
  diffusion_microbatches_per_step: 1
  trainable_mode: diffusion
  train_diffusion_backbone: true
  vlm_loss_weight: 0.0
  state_loss_weight: 1.0

optimizer:
  adapter_learning_rate: 1.0e-4
  diffusion_learning_rate: 1.0e-4
  vlm_learning_rate: 0.0
  weight_decay: 0.0
  adam_beta1: 0.9
  adam_beta2: 0.95
  max_grad_norm: 1.0
  fused: true

scheduler:
  type: constant
  warmup_steps: 2500

ema:
  enabled: true
  decay: 0.9999
  update_every: 1

training:
  max_steps: 800000
  log_every: 20
  output_dir: outputs/gpic_512_hsdp_2x8
  torch_compile:
    enabled: true
    backend: inductor
    mode: default
    dynamic: false
    cache_size_limit: 16

checkpoint:
  save_every_steps: 5000
  keep_last_n: 2
  save_final: true
  resume_mode: wm_training
  resume_from: /share/project/eai_pwm/repos/wm-training/outputs/qwen3vl_gpic_patchlatent_2dpos_adaln_fm_logitnormal_buckets_512_stage2_from_step145000_fsdp/checkpoints/step_350000.dcp

distributed:
  strategy: fsdp2
  hsdp: true  # 2 nodes × 8 GPUs: shard within node, replicate across nodes

logging:
  wandb_enabled: true
  wandb_project: wm-raw
  wandb_name: gpic-512-hsdp-2x8-from-step350000
