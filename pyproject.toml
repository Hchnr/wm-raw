[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wm-raw"
version = "0.1.0"
description = "Static, CUDAGraph-ready world model training"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4.0",
    "safetensors>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wm_raw"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
